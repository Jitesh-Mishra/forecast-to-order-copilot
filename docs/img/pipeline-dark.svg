<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-label="Pipeline: weekly quantile forecasts become cost-optimal order-up-to levels, a budget LP trades service across SKUs, and a replay simulator scores every policy on held-out sales."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker></defs><rect width="1080" height="500" rx="14" fill="#0d1117" stroke="#30363d"/><text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">From a forecast to an order the business can defend</text><text x="32" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">The forecast is an input. The deliverable is the ordering policy and its simulated cost.</text><rect x="668" y="84" width="392" height="38" rx="10" fill="#3a1d12" stroke="#d95926" stroke-width="1.5"/><text x="864" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d95926" text-anchor="middle">config.yaml  ·  margin 30%  ·  holding 25%/yr  ·  spoilage 5%/wk</text><rect x="32" y="146" width="180" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="122.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">M5 sales</text><text x="122.0" y="213.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">Walmart CA_1 · FOODS</text><text x="122.0" y="229.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">1,437 SKUs · 277 weeks</text><rect x="244" y="146" width="180" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="334.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">features</text><text x="334.0" y="213.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">only weeks &lt; origin</text><text x="334.0" y="229.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">lags · price · SNAP</text><rect x="456" y="146" width="180" height="104" rx="10" fill="#13263d" stroke="#3987e5" stroke-width="1.5"/><text x="546.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">forecast</text><text x="546.0" y="213.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">LightGBM P30 to P98</text><text x="546.0" y="229.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">vs TSB · MA4 · naive</text><rect x="668" y="146" width="180" height="104" rx="10" fill="#0f2e23" stroke="#199e70" stroke-width="1.5"/><text x="758.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">policy</text><text x="758.0" y="213.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">CR = cu / (cu + co)</text><text x="758.0" y="229.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">S = Q(CR), per SKU</text><rect x="880" y="146" width="180" height="104" rx="10" fill="#0f2e23" stroke="#199e70" stroke-width="1.5"/><text x="970.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">budget LP</text><text x="970.0" y="213.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">HiGHS · pick service</text><text x="970.0" y="229.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">per SKU · λ = 0.063</text><line x1="212" y1="198.0" x2="240" y2="198.0" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="424" y1="198.0" x2="452" y2="198.0" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="636" y1="198.0" x2="664" y2="198.0" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="848" y1="198.0" x2="876" y2="198.0" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="758" y1="122" x2="758" y2="142" stroke="#d95926" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arb)"/><line x1="970" y1="122" x2="970" y2="142" stroke="#d95926" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arb)"/><rect x="456" y="300" width="392" height="86" rx="10" fill="#3a1d12" stroke="#d95926" stroke-width="1.5"/><text x="652.0" y="339.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">replay simulator</text><text x="652.0" y="358.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">held-out weeks · lost sales · carry-over stock</text><text x="652.0" y="374.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">cost = co x leftover + cu x lost</text><rect x="880" y="300" width="180" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="970.0" y="339.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">decision</text><text x="970.0" y="358.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">frontier · sensitivity</text><text x="970.0" y="374.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">exec brief</text><path d="M122,250 L122,343 L452,343" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><text x="136" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">actual weekly sales (never seen by the forecaster)</text><line x1="758" y1="250" x2="758" y2="296" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="766" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">S</text><path d="M940,250 C940,280 828,276 828,296" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><text x="950" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">budgeted S</text><line x1="848" y1="343" x2="876" y2="343" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="456" y="418" width="604" height="56" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="476" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6edf3" text-anchor="start">next  ·  planner copilot</text><text x="476" y="461" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Groq tool-calling over DuckDB tables · every number comes from a tool, never the LLM</text><line x1="970" y1="386" x2="970" y2="414" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#ar)"/></svg>